# nginx site config for file-cloud
# Install to: /etc/nginx/sites-available/file-cloud
# Enable with: sudo ln -s /etc/nginx/sites-available/file-cloud /etc/nginx/sites-enabled/file-cloud
#
# This starts as HTTP-only. Run deploy/setup-ssl.sh afterwards to obtain a
# certificate via certbot, which will rewrite this file to add the HTTPS
# server block and the HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name cloud.nasam-ag.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
